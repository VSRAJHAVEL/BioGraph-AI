# Koyeb Production Service Configuration for BioGraph AI
# Documentation: https://www.koyeb.com/docs/reference/koyeb-yaml
name: biograph-ai
services:
  - name: biograph-ai
    type: web
    git:
      repository: github.com/VSRAJHAVEL/BioGraph-AI
      branch: main
      builder: docker
      dockerfile: Dockerfile
    instance_type: nano
    regions:
      - fra
    ports:
      - port: 8000
        protocol: http
    routes:
      - path: /
        port: 8000
    env:
      - key: PORT
        value: "8000"
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: LOW_MEMORY_MODE
        value: "1"
