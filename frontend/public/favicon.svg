<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161922"/>
      <stop offset="50%" stop-color="#0d1017"/>
      <stop offset="100%" stop-color="#06070a"/>
    </linearGradient>

    <!-- Gold Accent Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffdeac"/>
      <stop offset="50%" stop-color="#f1cf9c"/>
      <stop offset="100%" stop-color="#c99742"/>
    </linearGradient>

    <!-- Sage Accent Gradient -->
    <linearGradient id="sageGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b4f0cf"/>
      <stop offset="100%" stop-color="#4eaf7b"/>
    </linearGradient>

    <!-- Specular Rim Gradient -->
    <linearGradient id="rimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(241, 207, 156, 0.7)"/>
      <stop offset="40%" stop-color="rgba(255, 255, 255, 0.2)"/>
      <stop offset="100%" stop-color="rgba(255, 255, 255, 0.05)"/>
    </linearGradient>

    <!-- Soft Glow Filter -->
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Apple macOS Style Squircle Container -->
  <rect x="10" y="10" width="236" height="236" rx="56" fill="url(#bgGrad)" stroke="url(#rimGrad)" stroke-width="4.5"/>

  <!-- Molecular Graph / Atomic Orbital Geometry -->
  <g transform="translate(128, 128)">
    <!-- Orbital Rings -->
    <ellipse rx="74" ry="28" fill="none" stroke="url(#goldGrad)" stroke-width="7" opacity="0.9" transform="rotate(30)"/>
    <ellipse rx="74" ry="28" fill="none" stroke="url(#goldGrad)" stroke-width="7" opacity="0.9" transform="rotate(-30)"/>
    <ellipse rx="74" ry="28" fill="none" stroke="url(#goldGrad)" stroke-width="7" opacity="0.9" transform="rotate(90)"/>

    <!-- Central Core Nucleus (Glowing Gold + White Hot Center) -->
    <circle r="19" fill="url(#goldGrad)" filter="url(#glow)"/>
    <circle r="10" fill="#ffffff"/>

    <!-- Peripheral GNN / Molecular Graph Nodes -->
    <circle cx="58" cy="-34" r="8.5" fill="#99D3B4" filter="url(#glow)"/>
    <circle cx="-58" cy="34" r="8.5" fill="#99D3B4"/>

    <circle cx="58" cy="34" r="8.5" fill="#7C9CC4" filter="url(#glow)"/>
    <circle cx="-58" cy="-34" r="8.5" fill="#7C9CC4"/>

    <circle cx="0" cy="-72" r="9" fill="#C98AA3" filter="url(#glow)"/>
    <circle cx="0" cy="72" r="9" fill="#9A86C9" filter="url(#glow)"/>
  </g>
</svg>
